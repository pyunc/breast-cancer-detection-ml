name: 'Prepare Deployment Manifest'
description: 'Substitutes model and preprocessor URLs in a Kubernetes manifest file.'
inputs:
  manifest_path:
    description: 'Path to the Kubernetes manifest file.'
    required: true
  model_url:
    description: 'Remote model URL.'
    required: false
  preprocessor_url:
    description: 'Remote preprocessor URL.'
    required: false
outputs:
  manifest_path:
    description: 'Path to the processed Kubernetes manifest file.'
    value: ${{ steps.prepare.outputs.manifest_path }}
runs:
  using: "composite"
  steps:
    - name: Prepare manifests (inject model URLs)
      id: prepare
      shell: bash
      run: |
        set -euo pipefail
        echo "[prepare-deployment-manifest] manifest_path='${{ inputs.manifest_path }}'"
        echo "[prepare-deployment-manifest] raw model_url input='${{ inputs.model_url }}'"
        echo "[prepare-deployment-manifest] raw preprocessor_url input='${{ inputs.preprocessor_url }}'"
        echo "[prepare-deployment-manifest] env MODEL_URL='${MODEL_URL:-}'"
        echo "[prepare-deployment-manifest] env PREPROCESSOR_URL='${PREPROCESSOR_URL:-}'"

        # Compute effective values: prefer inputs, fallback to env vars if inputs empty
        EFFECTIVE_MODEL_URL='${{ inputs.model_url }}'
        if [ -z "$EFFECTIVE_MODEL_URL" ] && [ -n "${MODEL_URL:-}" ]; then
          EFFECTIVE_MODEL_URL="$MODEL_URL"
        fi
        EFFECTIVE_PREPROCESSOR_URL='${{ inputs.preprocessor_url }}'
        if [ -z "$EFFECTIVE_PREPROCESSOR_URL" ] && [ -n "${PREPROCESSOR_URL:-}" ]; then
          EFFECTIVE_PREPROCESSOR_URL="$PREPROCESSOR_URL"
        fi

        echo "[prepare-deployment-manifest] effective model_url='$EFFECTIVE_MODEL_URL'"
        echo "[prepare-deployment-manifest] effective preprocessor_url='$EFFECTIVE_PREPROCESSOR_URL'"

        if [ -z "$EFFECTIVE_MODEL_URL" ] && [ -z "$EFFECTIVE_PREPROCESSOR_URL" ]; then
          echo "::warning::No model or preprocessor URL provided (inputs/env). Skipping manifest preparation."
          echo "manifest_path=${{ inputs.manifest_path }}" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "Original manifest snippet:" && head -n 120 "${{ inputs.manifest_path }}" || true
        
        processed_manifest_path="${{ runner.temp }}/processed-manifest.yaml"
        cp "${{ inputs.manifest_path }}" "$processed_manifest_path"

        if [ -n "$EFFECTIVE_MODEL_URL" ]; then
          sed -i "s|__MODEL_URL__|$EFFECTIVE_MODEL_URL|g" "$processed_manifest_path"
        fi
        if [ -n "$EFFECTIVE_PREPROCESSOR_URL" ]; then
          sed -i "s|__PREPROCESSOR_URL__|$EFFECTIVE_PREPROCESSOR_URL|g" "$processed_manifest_path"
        fi
        
        echo "Processed manifest diff:" && diff -u "${{ inputs.manifest_path }}" "$processed_manifest_path" || true
        echo "manifest_path=$processed_manifest_path" >> $GITHUB_OUTPUT

    - name: Set output
      id: set_output
      shell: bash
      run: echo "manifest_path=${{ steps.prepare.outputs.manifest_path }}" >> $GITHUB_OUTPUT
