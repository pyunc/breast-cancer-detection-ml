name: 'Wait for Kubernetes Job'
description: 'Waits for a Kubernetes Job to complete.'
inputs:
  job_name:
    description: 'The name of the Kubernetes Job to wait for.'
    required: true
runs:
  using: "composite"
  steps:
    - name: Wait for Job completion
      shell: bash
      run: |
        set -e
        JOB_NAME="${{ inputs.job_name }}"
        echo "Waiting for Job: $JOB_NAME"
        for i in $(seq 1 60); do
          S=$(kubectl get job "$JOB_NAME" -o jsonpath='{.status.succeeded}') || true
          F=$(kubectl get job "$JOB_NAME" -o jsonpath='{.status.failed}') || true
          echo "Attempt $i: succeeded=$S failed=$F";
          if [ "$S" = "1" ]; then
            echo "Job completed successfully"; break; fi
          if [ "${F:-0}" != "" ] && [ "$F" -gt 0 ]; then
            echo "Job failed"; kubectl describe job "$JOB_NAME"; kubectl logs -l job-name="$JOB_NAME" --tail=200; exit 1; fi
          sleep 10;
        done
        if [ "${S:-0}" != "1" ]; then
          echo "Timed out waiting for job"; kubectl describe job "$JOB_NAME"; kubectl logs -l job-name="$JOB_NAME" --tail=200; exit 1; fi
        echo '--- Job Pod Logs (last 400 lines) ---'
        kubectl logs -l job-name="$JOB_NAME" --tail=400 || true
