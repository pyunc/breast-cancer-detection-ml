name: CI/CD Pipeline Serving

on:
  push:
    branches: [dev, feat/*, main]
    paths:
      - 'src/**'
      - 'pipelines/**'
      - 'k8s/**'
      - '.github/**'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'stage'
        type: string
      manifests:
        description: 'Kubernetes manifests to deploy (multiline)'
        required: false
        default: './k8s/inference-pipeline-deployment.yaml'
        type: string
      images:
        description: 'Inference image (with tag) to use'
        required: false
        default: 'pauloyuncha/breast-cancer-detection-ml:latest'
        type: string
      model_url:
        description: 'Override model URL (skip auto-discovery)'
        required: false
        type: string
      preprocessor_url:
        description: 'Override preprocessor URL (skip auto-discovery)'
        required: false
        type: string
      cluster_name:
        description: 'Explicit DigitalOcean Kubernetes cluster name (optional)'
        required: false
        type: string
      run_deployment:
        description: 'Set to true to run deployment'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover_model:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'stage' }}
    outputs:
      model_url: ${{ steps.find.outputs.model_url }}
      preprocessor_url: ${{ steps.find.outputs.preprocessor_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install boto3
      - name: Run discovery script
        id: find
        env:
          DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: python3 .github/scripts/discover_latest_model.py
  cd:
    needs: discover_model
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.run_deployment != 'false') }}
    uses: ./.github/workflows/deploy.yaml
    with:
      manifests: ${{ github.event.inputs.manifests || './k8s/inference-pipeline-deployment.yaml' }}
      images: ${{ github.event.inputs.images }}
      environment: ${{ github.event.inputs.environment || 'dev' }}
      model_url: ${{ github.event.inputs.model_url || needs.discover_model.outputs.model_url }}
      preprocessor_url: ${{ github.event.inputs.preprocessor_url || needs.discover_model.outputs.preprocessor_url }}
      cluster_name: ${{ github.event.inputs.cluster_name }}
    secrets: inherit
