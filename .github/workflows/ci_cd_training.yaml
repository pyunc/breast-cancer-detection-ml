name: CI/CD Pipeline Training

on:
  # push:
  #       branches: [dev, main]
  #       paths:
  #           - 'src/**'
  #           - 'pipelines/**'
  #           - 'k8s/**'
  #           - '.github/**'
  pull_request:
        branches: [dev, main]
  workflow_call:
      inputs:
          environment:
              description: 'Environment to deploy to'
              required: true
              default: 'stage'
              type: string
          tune_hyperparameters:
            description: 'Enable hyperparameter tuning'
            required: false
            default: true
            type: boolean
          manifests:
            description: 'Kubernetes training manifest path'
            required: false
            default: './k8s/train-job.yaml'
            type: string
          image:
            description: 'Training image (with tag) to use'
            required: false
            default: 'pauloyuncha/breast-cancer-detection-ml:latest'
            type: string
          cluster_name:
            description: 'DigitalOcean Kubernetes cluster name or ID (optional – auto-pick first if empty)'
            required: false
            type: string
      secrets:
          DO_API_TOKEN:
              required: true
          DO_SPACES_ACCESS_KEY:
              required: true
          DO_SPACES_SECRET_KEY:
              required: true
          DO_SPACES_BUCKET:
              required: true
          DO_SPACES_REGION:
              required: true
  workflow_dispatch:
      inputs:
          environment:
              description: 'Environment to deploy to'
              required: true
              default: 'stage'
              type: string
          tune_hyperparameters:
            description: 'Enable hyperparameter tuning'
            required: false
            default: true
            type: boolean
          manifests:
            description: 'Kubernetes training manifest path'
            required: false
            default: './k8s/train-job.yaml'
            type: string
          image:
            description: 'Training image (with tag) to use'
            required: false
            default: 'pauloyuncha/breast-cancer-detection-ml:latest'
            type: string
          cluster_name:
            description: 'DigitalOcean Kubernetes cluster name or ID (optional – auto-pick first if empty)'
            required: false
            type: string

jobs:
  train:
    runs-on: ubuntu-latest
    # Use fallback when not workflow_dispatch or workflow_call (push/PR events have no inputs.*)
    environment: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.environment || 'stage' }}
    env:
      # Fallback vars (use inputs only if workflow_dispatch or workflow_call)
      ENVIRONMENT: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.environment || 'stage' }}
      MANIFEST: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.manifests || './k8s/train-job.yaml' }}
      IMAGE: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.image || 'pauloyuncha/breast-cancer-detection-ml:latest' }}
      TUNE: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.tune_hyperparameters ||  'true' }}
      CLUSTER_NAME_INPUT: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.cluster_name || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display training parameters
        run: |
          echo "Event: $GITHUB_EVENT_NAME";
          echo "Environment: $ENVIRONMENT";
          echo "Manifest: $MANIFEST";
          echo "Image: $IMAGE";
          echo "Tune: $TUNE";
          echo "Cluster (requested): '$CLUSTER_NAME_INPUT'";

      - name: Setup DigitalOcean and Kubernetes
        id: do_k8s_setup
        uses: ./.github/actions/do-k8s-setup
        with:
          do_token: ${{ secrets.DO_API_TOKEN }}
          cluster_name: ${{ env.CLUSTER_NAME_INPUT }}

      - name: Prepare training manifest
        id: prep
        uses: ./.github/actions/prepare-k8s-manifest
        with:
          manifest_path: ${{ env.MANIFEST }}
          image: ${{ env.IMAGE }}
          tune_flag: ${{ env.TUNE }}

      - name: Apply training Job
        run: |
          set -e
          echo "Applying manifest with job name from previous step"
          kubectl apply -f "$MANIFEST"
          echo 'Current Jobs:'
          kubectl get jobs -l app=train -o wide || true
          echo 'Pods:'
          kubectl get pods -l app=train -o wide || true

      - name: Wait for Job completion
        uses: ./.github/actions/wait-for-k8s-job
        with:
          job_name: ${{ steps.prep.outputs.job_name }}

      - name: Handle model artifacts
        uses: ./.github/actions/handle-model-artifacts
        with:
          job_name: ${{ steps.prep.outputs.job_name }}
          do_spaces_access_key: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          do_spaces_secret_key: ${{ secrets.DO_SPACES_SECRET_KEY }}
          do_spaces_bucket: ${{ secrets.DO_SPACES_BUCKET }}
          do_spaces_region: ${{ secrets.DO_SPACES_REGION }}
          github_run_number: ${{ github.run_number }}
          github_sha: ${{ github.sha }}

      - name: Write model metadata to bucket
        run: |
          set -e
          pip install boto3
          MODEL_FOLDER="models/${{ github.run_number }}-${{ github.sha }}"
          python3 .github/scripts/write_model_metadata.py "$MODEL_FOLDER"
        env:
          DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}

      - name: Summary
        run: |
          echo "Training job finished" >> $GITHUB_STEP_SUMMARY
          echo "Image: $IMAGE" >> $GITHUB_STEP_SUMMARY
          echo "Tune: $TUNE" >> $GITHUB_STEP_SUMMARY
          echo "Cluster: ${{ steps.do_k8s_setup.outputs.cluster_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Job: ${{ steps.prep.outputs.job_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Model metadata written to bucket" >> $GITHUB_STEP_SUMMARY
