name: Deploy

on:
  workflow_call:
    inputs:
      manifests:
        description: 'Kubernetes manifests to deploy'
        required: true
        type: string
      images:
        description: 'Container images to deploy'
        required: true
        type: string
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'stage'
        type: string
      model_url:
        description: 'Remote model URL'
        required: false
        type: string
      preprocessor_url:
        description: 'Remote preprocessor URL'
        required: false
        type: string
      cluster_name:
        description: 'DigitalOcean Kubernetes cluster name or ID (optional – auto-pick first if empty)'
        required: false
        type: string
    secrets:
      DO_API_TOKEN:
        description: 'DigitalOcean API token (read/write)'
        required: true
      DO_SPACES_ACCESS_KEY:
        description: 'DigitalOcean Spaces access key'
        required: true
      DO_SPACES_SECRET_KEY:
        description: 'DigitalOcean Spaces secret key'
        required: true
      DO_SPACES_BUCKET:
        description: 'DigitalOcean Spaces bucket name'
        required: true
      DO_SPACES_REGION:
        description: 'DigitalOcean Spaces region'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_API_TOKEN }}
      DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.5
      
      - name: Display initial deployment info
        run: |
          echo "=== Deployment Information (Initial) ==="
          echo "Environment: ${{ inputs.environment }}"
          echo "Manifests: ${{ inputs.manifests }}"
          echo "Images: ${{ inputs.images }}"
          echo "Requested Cluster (may be blank for auto): ${{ inputs.cluster_name }}"
          echo "Model URL (input): ${{ inputs.model_url }}"
          echo "Preprocessor URL (input): ${{ inputs.preprocessor_url }}"
          echo "Model URL (env var in Environment): ${{ vars.MODEL_URL }}"
          echo "Preprocessor URL (env var in Environment): ${{ vars.PREPROCESSOR_URL }}"
          if [ -n "${DIGITALOCEAN_ACCESS_TOKEN}" ]; then echo "DigitalOcean token detected (masked)"; else echo "DigitalOcean token MISSING"; fi
          echo "=== End Deployment Information ==="

      - name: Read model metadata from bucket
        id: read_metadata
        run: |
          set -e
          pip install boto3
          python3 .github/scripts/read_model_metadata.py
        env:
          DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}

      - name: Export model URLs to env
        run: |
          set -euo pipefail
          # Priority: 1. Metadata from bucket, 2. Workflow inputs, 3. Environment variables
          METADATA_MODEL='${{ steps.read_metadata.outputs.model_url }}'
          METADATA_PREP='${{ steps.read_metadata.outputs.preprocessor_url }}'
          MODEL_IN='${{ inputs.model_url }}'
          PREP_IN='${{ inputs.preprocessor_url }}'
          MODEL_ENV_VAR='${{ vars.MODEL_URL }}'
          PREP_ENV_VAR='${{ vars.PREPROCESSOR_URL }}'
          
          echo "=== Model URL Priority Resolution ==="
          echo "1. Metadata from bucket (highest priority): model=$METADATA_MODEL, preprocessor=$METADATA_PREP"
          echo "2. Workflow inputs: model=$MODEL_IN, preprocessor=$PREP_IN"
          echo "3. Environment variables: model=$MODEL_ENV_VAR, preprocessor=$PREP_ENV_VAR"
          
          EFFECTIVE_MODEL="$METADATA_MODEL"
          if [ -z "$EFFECTIVE_MODEL" ] && [ -n "$MODEL_IN" ]; then EFFECTIVE_MODEL="$MODEL_IN"; fi
          if [ -z "$EFFECTIVE_MODEL" ] && [ -n "$MODEL_ENV_VAR" ]; then EFFECTIVE_MODEL="$MODEL_ENV_VAR"; fi
          
          EFFECTIVE_PREP="$METADATA_PREP"
          if [ -z "$EFFECTIVE_PREP" ] && [ -n "$PREP_IN" ]; then EFFECTIVE_PREP="$PREP_IN"; fi
          if [ -z "$EFFECTIVE_PREP" ] && [ -n "$PREP_ENV_VAR" ]; then EFFECTIVE_PREP="$PREP_ENV_VAR"; fi
          
          echo "Final effective URLs: model=$EFFECTIVE_MODEL, preprocessor=$EFFECTIVE_PREP"
          
          if [ -n "$EFFECTIVE_MODEL" ]; then echo "MODEL_URL=$EFFECTIVE_MODEL" >> $GITHUB_ENV; echo "Exported MODEL_URL"; else echo "::notice::No effective MODEL_URL found"; fi
          if [ -n "$EFFECTIVE_PREP" ]; then echo "PREPROCESSOR_URL=$EFFECTIVE_PREP" >> $GITHUB_ENV; echo "Exported PREPROCESSOR_URL"; else echo "::notice::No effective PREPROCESSOR_URL found"; fi
      
      - name: Prepare manifests
        id: prepare_manifest
        uses: ./.github/actions/prepare-deployment-manifest
        with:
          manifest_path: ${{ inputs.manifests }}
          model_url: ${{ steps.read_metadata.outputs.model_url || inputs.model_url }}
          preprocessor_url: ${{ steps.read_metadata.outputs.preprocessor_url || inputs.preprocessor_url }}

      - name: Show prepared manifest (for debugging)
        if: always()
        run: |
          set -euo pipefail
          echo "Prepared manifest path: ${{ steps.prepare_manifest.outputs.manifest_path }}"
          echo "::group::Prepared manifest content"
          cat "${{ steps.prepare_manifest.outputs.manifest_path }}"
          echo "::endgroup::"
          echo "Verifying placeholders are replaced..."
          if grep -nE "__MODEL_URL__|__PREPROCESSOR_URL__" "${{ steps.prepare_manifest.outputs.manifest_path }}"; then
            echo "::error::Unresolved placeholders found in prepared manifest. Aborting deployment."
            exit 1
          else
            echo "All placeholders resolved."
          fi

      - name: Upload prepared manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: prepared-manifest
          path: ${{ steps.prepare_manifest.outputs.manifest_path }}

      - name: Setup DigitalOcean and Kubernetes
        id: do_k8s_setup
        uses: ./.github/actions/do-k8s-setup
        with:
          do_token: ${{ secrets.DO_API_TOKEN }}
          cluster_name: ${{ inputs.cluster_name }}
      
      - name: Apply manifests
        run: |
          set -e
          kubectl apply -f ${{ steps.prepare_manifest.outputs.manifest_path }}
          echo '--- Deployment ---'
          kubectl get deploy -o wide
          echo '--- Pods (pre-rollout) ---'
          kubectl get pods -l app=inference -o wide || true
      
      - name: Wait for rollout
        uses: ./.github/actions/wait-for-rollout
        with:
          deployment_name: breast-cancer-detection-ml-inference-pipeline-deployment
      
      - name: Show services
        run: |
          kubectl get svc inference -o wide || true

      - name: Describe deployment and show pod logs/env (debug)
        if: always()
        run: |
          set -e
          echo '--- Describe Deployment ---'
          kubectl describe deploy breast-cancer-detection-ml-inference-pipeline-deployment || true
          echo '--- Pods ---'
          kubectl get pods -l app=inference -o wide || true
          POD=$(kubectl get pods -l app=inference -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD" ]; then
            echo "--- Logs (last 200 lines) for $POD ---"
            kubectl logs "$POD" --all-containers=true --tail=200 || true
            echo '--- Pod env filtered ---'
            kubectl exec "$POD" -- /bin/sh -lc 'printenv | grep -E "MODEL_URL|PREPROCESSOR_URL|APP_"' || true
          else
            echo 'No pods found with label app=inference'
          fi
      
      - name: Summary
        run: |
          RESOLVED_CLUSTER=${{ steps.do_k8s_setup.outputs.cluster_name || inputs.cluster_name }}
          echo "Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "Image(s): ${{ inputs.images }}" >> $GITHUB_STEP_SUMMARY
          echo "Cluster: ${RESOLVED_CLUSTER}" >> $GITHUB_STEP_SUMMARY
          echo "Model URL: ${{ inputs.model_url }}" >> $GITHUB_STEP_SUMMARY
          echo "Preprocessor URL: ${{ inputs.preprocessor_url }}" >> $GITHUB_STEP_SUMMARY
