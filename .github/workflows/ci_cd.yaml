name: CI/CD Pipeline

on:
    push:
        branches: [dev, feat/*, main]
        paths:
            - 'src/**'
            - 'pipelines/**'
    pull_request:
        branches: [dev, main]
    workflow_dispatch:
        inputs:
            environment:
                description: 'Environment to deploy to'
                required: true
                default: 'dev'
                type: choice
                options:
                - dev
                - stage
                - prod
            manifests:
                description: 'Kubernetes manifests to deploy (multiline)'
                required: false
                default: './k8s/inference-pipeline-deployment.yaml'
                type: string
            images:
                description: 'Container images to deploy (use placeholder {IMAGE_TAG} for dynamic image)'
                required: false
                default: '{IMAGE_TAG}'
                type: string
            run_tests:
                description: 'Run tests'
                required: false
                default: true
                type: boolean
            run_linting:
                description: 'Run linting'
                required: false
                default: true
                type: boolean
            custom_tag:
                description: 'Custom Docker tag (optional)'
                required: false
                type: string
            run_training:
                description: 'Run training step'
                required: false
                default: false
                type: boolean
            run_deployment:
                description: 'Run deployment step in K8s'
                required: false
                default: false
                type: boolean
            run_ci:
                description: 'Run ci step by Docker build and push'
                required: false
                default: false
                type: boolean
            python_version:
                description: 'Python version to use'
                required: false
                default: '3.11'
                type: string
            model_url:
                description: 'Override model URL (skip training)'
                required: false
                type: string
            preprocessor_url:
                description: 'Override preprocessor URL (skip training)'
                required: false
                type: string
            

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    lint:
        runs-on: ubuntu-latest
        if: ${{ github.event.inputs.run_linting != 'false' }}
        outputs:
            lint_status: ${{ steps.lint.outputs.status }}
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.11'
            - name: Install uv
              run: curl -LsSf https://astral.sh/uv/install.sh | sh
            - name: Create virtual environment and install dependencies
              run: |
                uv venv
                source .venv/bin/activate
                uv pip install --upgrade pip
                uv add ruff
            - name: Run linter
              id: lint
              run: |
                source .venv/bin/activate
                uv run ruff check --no-cache --fix --output-format=json > lint-results.json || true
                echo "status=completed" >> $GITHUB_OUTPUT
            # build the lint results artifact
            - name: Create lint results artifact
              run: |
                mkdir -p lint-results
                if [ -f lint-results.json ]; then
                  mv lint-results.json lint-results/
                else
                  echo "No lint results found." >> lint-results/lint-results.json
                fi
            - name: Upload lint results
              uses: actions/upload-artifact@v4
              with:
                name: lint-results
                path: lint-results/lint-results.json
            - name: Display lint results artifact URL
              run: |
                echo "📦 Lint Results Artifact URL:"
                echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/lint-results"

    test:
        runs-on: ubuntu-latest
        needs: lint
        if: ${{ always() && !cancelled() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && github.event.inputs.run_tests != 'false' }}
        outputs:
            test_status: ${{ steps.test.outputs.status }}
            coverage: ${{ steps.coverage.outputs.coverage }}
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.11'
            - name: Install uv
              run: curl -LsSf https://astral.sh/uv/install.sh | sh
            - name: Create virtual environment and install dependencies
              run: |
                uv venv
                source .venv/bin/activate
                uv pip install --upgrade pip
                uv pip install -r requirements.txt
                uv pip install pytest pytest-cov
                uv pip install -e .
            - name: Run tests
              id: test
              run: |
                source .venv/bin/activate
                uv run pytest tests/src -v --cache-clear --rootdir=. --cov=src --cov-report=xml --cov-report=html
                echo "status=completed" >> $GITHUB_OUTPUT
            - name: Generate coverage report
              id: coverage
              run: |
                coverage_percent=$(grep -o 'line-rate="[0-9.]*"' coverage.xml | head -1 | cut -d'"' -f2 | awk '{print $1*100}')
                echo "coverage=${coverage_percent}%" >> $GITHUB_OUTPUT
            - name: Upload test results
              uses: actions/upload-artifact@v4
              with:
                name: test-results
                path: |
                  coverage.xml
                  htmlcov/
                  downloaded-artifacts/
                retention-days: 30
            - name: Display test results artifact URL
              run: |
                echo "📦 Test Results Artifact URL:"
                echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/test-results"

    train:
        needs: test
        if: ${{ always() && !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && github.event.inputs.run_training == 'true' }}
        uses: ./.github/workflows/train.yaml
        with:
          environment: ${{ github.event.inputs.environment || 'dev' }}
          python_version: ${{ github.event.inputs.python_version || '3.11' }}
          tune_hyperparameters: true
        secrets:
          DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
                
    ci:
        runs-on: ubuntu-latest
        needs: test
        if: ${{ always() && !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && github.event.inputs.run_ci == 'true' }}
        environment: ${{ github.event.inputs.environment || 'dev' }}
        outputs:
            image_tag: ${{ steps.meta.outputs.tags }}
            image_digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set image metadata
              id: meta
              run: |
                if [ "${{ github.event.inputs.custom_tag }}" != "" ]; then
                  tag="${{ github.event.inputs.custom_tag }}"
                else
                  tag="v${{ github.run_number }}"
                fi
                echo "tags=pauloyuncha/breast-cancer-detection-ml:latest,pauloyuncha/breast-cancer-detection-ml:${tag}" >> $GITHUB_OUTPUT
            - name: authenticate to Docker registry
              uses: docker/login-action@v3.1.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}
            - name: Set up Docker Buildx
              id: build
              uses: docker/build-push-action@v5.3.0
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
            - name: Generate deployment manifest
              run: |
                mkdir -p deployment-artifacts
                echo "Image: ${{ steps.meta.outputs.tags }}" > deployment-artifacts/deployment-info.txt
                echo "Digest: ${{ steps.build.outputs.digest }}" >> deployment-artifacts/deployment-info.txt
                echo "Environment: ${{ github.event.inputs.environment || 'auto' }}" >> deployment-artifacts/deployment-info.txt
                date -u "+%Y-%m-%dT%H:%M:%SZ" >> deployment-artifacts/deployment-info.txt
            - name: Upload deployment artifacts
              uses: actions/upload-artifact@v4
              with:
                name: deployment-artifacts
                path: deployment-artifacts/
            - name: Display deployment artifacts URL
              run: |
                echo "📦 Deployment Artifacts URL:"
                echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/deployment-artifacts"

    cd:
        needs: [ci]
        if: ${{ always() && !cancelled() && needs.ci.result == 'success' && github.event.inputs.run_deployment == 'true' }}
        uses: ./.github/workflows/deploy.yaml
        with:
          manifests: ${{ github.event.inputs.manifests || './k8s/inference-pipeline-deployment.yaml' }}
          images: ${{ github.event.inputs.images == '{IMAGE_TAG}' && needs.ci.outputs.image_tag || github.event.inputs.images || needs.ci.outputs.image_tag }}
          environment: ${{ github.event.inputs.environment || 'dev' }}
          model_url: ${{ github.event.inputs.model_url }}
          preprocessor_url: ${{ github.event.inputs.preprocessor_url }}
        secrets:
          K8S_CONFIG: ${{ secrets.K8S_CONFIG }}
