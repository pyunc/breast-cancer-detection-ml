name: CI/CD Pipeline Build

on:
    push:
        branches: [dev, main]
        paths:
            - 'src/**'
            - 'pipelines/**'
            - 'k8s/**'
            - '.github/**'
    pull_request:
        branches: [dev, main]
    workflow_dispatch:
        inputs:
            environment:
                description: 'Environment to deploy to'
                required: true
                default: 'dev'
                type: choice
                options:
                - dev
                - stage
                - prod
            images:
                description: 'Container images to deploy (use placeholder {IMAGE_TAG} for dynamic image)'
                required: false
                default: '{IMAGE_TAG}'
                type: string
            run_ci:
                description: 'Run ci step by Docker build and push'
                required: false
                default: true
                type: boolean

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    lint:
        runs-on: ubuntu-latest
        outputs:
            lint_status: ${{ steps.lint.outputs.status }}
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.11'
            - name: Install uv
              run: curl -LsSf https://astral.sh/uv/install.sh | sh
            - name: Create virtual environment and install dependencies
              run: |
                uv venv
                source .venv/bin/activate
                uv pip install --upgrade pip
                uv add ruff
            - name: Run linter
              id: lint
              run: |
                source .venv/bin/activate
                uv run ruff check --no-cache --fix --output-format=json > lint-results.json || true
                echo "status=completed" >> $GITHUB_OUTPUT
            - name: Create lint results artifact
              run: |
                mkdir -p lint-results
                if [ -f lint-results.json ]; then
                  mv lint-results.json lint-results/
                else
                  echo "No lint results found." >> lint-results/lint-results.json
                fi
            - name: Upload lint results
              uses: actions/upload-artifact@v4
              with:
                name: lint-results
                path: lint-results/lint-results.json
            - name: Display lint results artifact URL
              run: |
                echo "📦 Lint Results Artifact URL:"
                echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/lint-results"

    test:
        runs-on: ubuntu-latest
        needs: lint
        outputs:
            test_status: ${{ steps.test.outputs.status }}
            coverage: ${{ steps.coverage.outputs.coverage }}
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.11'
            - name: Install uv
              run: curl -LsSf https://astral.sh/uv/install.sh | sh
            - name: Create virtual environment and install dependencies
              run: |
                uv venv
                source .venv/bin/activate
                uv pip install --upgrade pip
                uv pip install -r requirements.txt
                uv pip install pytest pytest-cov
                uv pip install -e .
                echo "Packages Installed"
            - name: Run tests
              id: test
              run: |
                source .venv/bin/activate
                uv run pytest tests/src -v --cache-clear --rootdir=. --cov=src --cov-report=xml --cov-report=html
                echo "status=completed" >> $GITHUB_OUTPUT
            - name: Generate coverage report
              id: coverage
              run: |
                coverage_percent=$(grep -o 'line-rate="[0-9.]*"' coverage.xml | head -1 | cut -d'"' -f2 | awk '{print $1*100}')
                echo "coverage=${coverage_percent}%" >> $GITHUB_OUTPUT
            - name: Upload test results
              uses: actions/upload-artifact@v4
              with:
                name: test-results
                path: |
                  coverage.xml
                  htmlcov/
                  downloaded-artifacts/
                retention-days: 30
            - name: Display test results artifact URL
              run: |
                echo "📦 Test Results Artifact URL:"
                echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/test-results"
    
    ci:
        runs-on: ubuntu-latest
        needs: test
        if: ${{ always() && !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (github.event_name != 'workflow_dispatch' || github.event.inputs.run_ci == 'true') }}
        environment: ${{ github.event.inputs.environment || 'dev' }}
        outputs:
            image_tag: ${{ steps.meta.outputs.tags }}
            image_digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set image metadata
              id: meta
              run: |
                tag="v${{ github.run_number }}"
                echo "tags=pauloyuncha/breast-cancer-detection-ml:latest,pauloyuncha/breast-cancer-detection-ml:${tag}" >> $GITHUB_OUTPUT
            - name: authenticate to Docker registry
              uses: docker/login-action@v3.1.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}
            - name: Set up Docker Buildx
              id: build
              uses: docker/build-push-action@v5.3.0
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
            - name: Generate deployment manifest
              run: |
                mkdir -p deployment-artifacts
                echo "Image: ${{ steps.meta.outputs.tags }}" > deployment-artifacts/deployment-info.txt
                echo "Digest: ${{ steps.build.outputs.digest }}" >> deployment-artifacts/deployment-info.txt
                echo "Environment: ${{ github.event.inputs.environment || 'auto' }}" >> deployment-artifacts/deployment-info.txt
                date -u "+%Y-%m-%dT%H:%M:%SZ" >> deployment-artifacts/deployment-info.txt
            - name: Upload deployment artifacts
              uses: actions/upload-artifact@v4
              with:
                name: deployment-artifacts
                path: deployment-artifacts/
            - name: Display deployment artifacts URL
              run: |
                echo "📦 Deployment Artifacts URL:"
                echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/deployment-artifacts"
                echo "Finished CI step."

    train:
        uses: ./.github/workflows/train_workflow.yaml
        needs: ci
        with:
            environment: ${{ github.event.inputs.environment || 'stage' }}
        secrets:
            DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
            DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
            DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
            DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}

    discover_model:
        runs-on: ubuntu-latest
        needs: train
        if: ${{ always() && !cancelled() && needs.train.result == 'success' }}
        environment: ${{ github.event.inputs.environment || 'stage' }}
        outputs:
            model_url: ${{ steps.export_urls.outputs.model_url || steps.find.outputs.model_url }}
            preprocessor_url: ${{ steps.export_urls.outputs.preprocessor_url || steps.find.outputs.preprocessor_url }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: '3.x'
            - name: Install dependencies
              run: pip install boto3
            - name: Debug environment before discovery
              run: |
                echo "GITHUB_OUTPUT: $GITHUB_OUTPUT"
                echo "Checking if secrets are available (not showing values for security)"
                [ -n "$DO_SPACES_BUCKET" ] && echo "DO_SPACES_BUCKET is set" || echo "DO_SPACES_BUCKET is missing"
                [ -n "$DO_SPACES_ACCESS_KEY" ] && echo "DO_SPACES_ACCESS_KEY is set" || echo "DO_SPACES_ACCESS_KEY is missing"
                [ -n "$DO_SPACES_SECRET_KEY" ] && echo "DO_SPACES_SECRET_KEY is set" || echo "DO_SPACES_SECRET_KEY is missing"
              env:
                DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
                DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
                DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
                DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
            - name: Run discovery script
              id: find
              env:
                DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
                DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
                DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
                DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
              run: |
                python3 .github/scripts/discover_latest_model.py
                # Also capture outputs using echo commands as backup
                if [ -f "$GITHUB_OUTPUT" ]; then
                  MODEL_URL=$(grep "^model_url=" "$GITHUB_OUTPUT" | cut -d'=' -f2- | tail -1)
                  PREP_URL=$(grep "^preprocessor_url=" "$GITHUB_OUTPUT" | cut -d'=' -f2- | tail -1)
                  echo "model_url=$MODEL_URL" >> $GITHUB_OUTPUT
                  echo "preprocessor_url=$PREP_URL" >> $GITHUB_OUTPUT
                  echo "Backup outputs written: model_url=$MODEL_URL, preprocessor_url=$PREP_URL"
                  # Export to environment for next jobs
                  echo "MODEL_URL=$MODEL_URL" >> $GITHUB_ENV
                  echo "PREPROCESSOR_URL=$PREP_URL" >> $GITHUB_ENV
                fi
            - name: Verify and export discovered URLs
              id: export_urls
              run: |
                MODEL_URL="${{ steps.find.outputs.model_url }}"
                PREP_URL="${{ steps.find.outputs.preprocessor_url }}"
                
                echo "Step outputs: model=$MODEL_URL, preprocessor=$PREP_URL"
                
                # Re-export to ensure they're captured
                echo "model_url=$MODEL_URL" >> $GITHUB_OUTPUT
                echo "preprocessor_url=$PREP_URL" >> $GITHUB_OUTPUT
                echo "Re-exported URLs: model=$MODEL_URL, preprocessor=$PREP_URL"
            - name: Check discovery outputs
              run: |
                echo "Contents of GITHUB_OUTPUT file:"
                cat "$GITHUB_OUTPUT" || echo "GITHUB_OUTPUT file not found"
                echo "Step outputs:"
                echo "model_url: ${{ steps.find.outputs.model_url }}"
                echo "preprocessor_url: ${{ steps.find.outputs.preprocessor_url }}"
                echo "Export step outputs:"
                echo "export model_url: ${{ steps.export_urls.outputs.model_url }}"
                echo "export preprocessor_url: ${{ steps.export_urls.outputs.preprocessor_url }}"

    debug_discovery:
        runs-on: ubuntu-latest
        needs: discover_model
        if: ${{ always() && !cancelled() && needs.discover_model.result == 'success' }}
        steps:
            - name: Show discovery outputs
              run: |
                echo "Discovered model_url: '${{ needs.discover_model.outputs.model_url }}'"
                echo "Discovered preprocessor_url: '${{ needs.discover_model.outputs.preprocessor_url }}'"
            - name: Validate discovery outputs are not empty
              run: |
                MODEL_URL='${{ needs.discover_model.outputs.model_url }}'
                PREP_URL='${{ needs.discover_model.outputs.preprocessor_url }}'
                if [ -z "$MODEL_URL" ] || [ -z "$PREP_URL" ]; then
                  echo "::error::discover_model outputs are empty; cannot continue to deploy."
                  echo "This usually means:"
                  echo "1. DigitalOcean Spaces secrets are missing or incorrect"
                  echo "2. No models found in the bucket"
                  echo "3. The discovery script failed to write outputs"
                  echo "Check the discover_model job logs for more details."
                  exit 1
                fi
                echo "✅ Discovery outputs are valid"

    deploy:
        needs: [ci, discover_model, debug_discovery]
        if: ${{ always() && !cancelled() && needs.discover_model.result == 'success' && needs.debug_discovery.result == 'success' }}
        uses: ./.github/workflows/deploy.yaml
        with:
            manifests: 'k8s/inference-pipeline-deployment.yaml'
            images: ${{ needs.ci.outputs.image_tag }}
            environment: ${{ github.event.inputs.environment || 'stage' }}
            model_url: ${{ needs.discover_model.outputs.model_url }}
            preprocessor_url: ${{ needs.discover_model.outputs.preprocessor_url }}
        secrets:
            DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
