# create a configmap for the k8s cluster
apiVersion: v1
kind: ConfigMap
metadata:
  name: aula-k8s-config
  namespace: production
data:
  # Add your configuration data here
  APP_VERSION_CONFIG: "7.0.0"
  APP_NAME_CONFIG: "prod-configmap-breast-cancer-detection-ml-inference-pipeline-with-observability"
  APP_AUTHOR_CONFIG: "Paulo Yun Cha"
  APP_VERSION: "7.0.0"
  APP_NAME: "prod-configmap-breast-cancer-detection-ml-inference-pipeline-with-observability"
  APP_AUTHOR: "Paulo Yun Cha"
  APP_SERVER_CONFIG: "cloud-prod-env"

---





apiVersion: apps/v1
kind: Deployment
metadata:
  name: breast-cancer-detection-ml-inference-pipeline-deployment
  namespace: production
spec:
  replicas: 4
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
      labels:
        app: inference
    spec:
      
      containers:
        - name: inference
          image: pauloyuncha/breast-cancer-detection-ml:latest
          command: ["uv"]
          args:
            - run
            - python3
            - tools/ml_service.py
            - --model-path
            - "/opt/ml/models/logistic_regression.joblib"
            - --preprocessor-path
            - "/opt/ml/models/preprocessor.joblib"
            - --port
            - "8000"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: "0.5"
              memory: "800Mi"
            requests:
              cpu: "0.5"
              memory: "800Mi"
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: aula-k8s-config
                  key: APP_VERSION_CONFIG
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: aula-k8s-config
                  key: APP_NAME_CONFIG
            - name: APP_AUTHOR
              valueFrom:
                configMapKeyRef:
                  name: aula-k8s-config
                  key: APP_AUTHOR_CONFIG
            - name: APP_SERVER
              valueFrom:
                configMapKeyRef:
                  name: aula-k8s-config
                  key: APP_SERVER_CONFIG
            - name: MODEL_URL
              value: "__MODEL_URL__"
            - name: PREPROCESSOR_URL
              value: "__PREPROCESSOR_URL__"
        # add health check
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8000
          #   initialDelaySeconds: 40
          #   periodSeconds: 30
          #   timeoutSeconds: 10
          #   failureThreshold: 3
          
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: production
spec:
  selector:
    app: inference
  ports:
    - name: http
      port: 8501
      targetPort: 8000
      protocol: TCP
  type: LoadBalancer




---
# Horizontal Pod Autoscaler for the inference pipeline
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: breast-cancer-detection-ml-inference-pipeline-deployment
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60

---






